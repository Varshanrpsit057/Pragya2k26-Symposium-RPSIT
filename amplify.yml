# AWS Amplify Hosting build (Gen 2): deploys the backend in amplify/ (Lambda, API Gateway,
# DynamoDB, S3), which writes amplify_outputs.json with the API address; then builds the
# website, which reads that address. Everything installs from package-lock.json.
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - node --version
    build:
      commands:
        # npm install (from package-lock.json) rather than npm ci: npm ci rejects the bundled
        # dependencies of Amplify's own CDK packages, though npm install resolves the same tree.
        - npm install --no-audit --no-fund --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
